<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>连接 Piik-RTC 服务器</title>
  <style>
    :root {
      color-scheme: light dark;
      --wall: #f3f5f8;
      --wall-2: #e5eaf2;
      --paper: #fffefb;
      --ink: #29374a;
      --muted: color-mix(in srgb, var(--ink) 75%, var(--paper));
      --line: color-mix(in srgb, var(--ink) 20%, var(--paper));
      --primary: #2765ce;
      --primary-ink: #fff;
      --action: #3478e5;
      --control-edge: color-mix(in srgb, var(--ink) 57%, var(--paper));
      --control-hover: #eef3ff;
      --control-selected: #e5efff;
      --surface-rim: rgb(255 255 255 / .95);
      --surface-shade: rgb(36 53 78 / .18);
      --surface-glaze: linear-gradient(165deg, rgb(255 255 255 / .6), transparent 65%, rgb(51 89 147 / .025));
      --control-shadow: 0 3px 0 var(--surface-shade), 0 5px 10px color-mix(in srgb, var(--surface-shade) 45%, transparent);
      --panel-shadow: inset 0 1px 0 var(--surface-rim), 0 3px 0 var(--surface-shade), 0 16px 36px color-mix(in srgb, var(--surface-shade) 55%, transparent);
      --danger: #d64541;
      --spring: cubic-bezier(.3, 1.45, .45, 1);
      --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --wall: #242a34;
        --wall-2: #2c3543;
        --paper: #354153;
        --ink: #f6f3eb;
        --primary: #f6f3eb;
        --primary-ink: #29374a;
        --action: #f6f3eb;
        --control-hover: #414f67;
        --control-selected: #f6f3eb;
        --surface-rim: rgb(222 234 255 / .12);
        --surface-shade: rgb(6 12 22 / .38);
        --surface-glaze: linear-gradient(165deg, rgb(224 237 255 / .06), transparent 65%, rgb(0 0 0 / .035));
        --danger: #e25a52;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px 20px;
      background:
        radial-gradient(1000px 620px at 8% -12%, color-mix(in srgb, #3478e5 12%, transparent), transparent 62%),
        radial-gradient(900px 580px at 102% 112%, color-mix(in srgb, #e77d38 9%, transparent), transparent 62%),
        var(--wall);
      color: var(--ink);
      font: 15px/1.5 var(--font);
      -webkit-font-smoothing: antialiased;
    }
    .launch {
      display: grid;
      justify-items: center;
      gap: 22px;
      width: min(500px, 100%);
      text-align: center;
    }
    .brand-mark { display: block; color: var(--ink); overflow: visible; }
    .heading { display: grid; justify-items: center; gap: 7px; }
    .title { margin: 0; font-size: 36px; line-height: 1.1; letter-spacing: -.04em; }
    .title small { margin-left: 6px; color: var(--muted); font-size: 15px; letter-spacing: 0; font-weight: 650; }
    .title .dot { color: #e77d38; }
    .welcome { margin: 0; color: var(--ink); font-size: 14px; font-weight: 600; }
    .welcome .spark { color: #d7982b; margin-right: 6px; }
    .panel {
      width: 100%;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 26px;
      background: var(--surface-glaze) var(--paper);
      box-shadow: var(--panel-shadow);
      text-align: left;
    }
    .panel-heading { display: grid; gap: 4px; margin-bottom: 18px; }
    .panel-heading h2 { margin: 0; font-size: 18px; letter-spacing: -.02em; }
    .panel-heading p { margin: 0; color: var(--muted); font-size: 12.5px; line-height: 1.65; }
    .field-label { display: block; margin-bottom: 8px; color: var(--muted); font-size: 12px; font-weight: 700; }
    .input {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 48px;
      padding: 0 12px;
      border: 2px solid var(--control-edge);
      border-radius: 18px;
      background: var(--paper);
      transition: border-color 140ms ease, background-color 140ms ease;
    }
    .input:focus-within { border-color: var(--action); outline: 3px solid var(--action); outline-offset: 2px; }
    .input svg { flex: none; color: var(--muted); }
    .input input {
      min-width: 0;
      flex: 1;
      height: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: 15px;
    }
    .input input::placeholder { color: color-mix(in srgb, var(--muted) 70%, transparent); }
    .hint { margin: 12px 0 0; color: var(--muted); font-size: 11px; line-height: 1.7; }
    .hint code { padding: 1px 5px; border-radius: 5px; background: var(--wall-2); font: 11px Consolas, monospace; color: var(--ink); }
    .actions { display: flex; gap: 10px; margin-top: 18px; }
    .btn {
      display: inline-flex;
      flex: 1;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 48px;
      padding: 0 18px;
      border: 2px solid var(--control-edge);
      border-radius: 999px;
      background: var(--paper);
      color: var(--ink);
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      box-shadow: var(--control-shadow);
      cursor: pointer;
      transition: transform 260ms var(--spring), background-color 140ms ease, border-color 140ms ease, box-shadow 140ms ease;
    }
    .btn:hover:not(:disabled) { transform: translateY(-2px); background: var(--control-hover); border-color: var(--ink); }
    .btn:active:not(:disabled) { transform: translateY(2px); box-shadow: none; transition-duration: 80ms; }
    .btn:disabled { opacity: .55; cursor: wait; }
    .btn.primary { border-color: var(--primary); background: var(--primary); color: var(--primary-ink); }
    .btn.primary:hover:not(:disabled) { background: color-mix(in srgb, var(--primary) 88%, #000); border-color: var(--primary); }
    .btn.secondary { flex: .82; }
    .btn[hidden] { display: none; }
    .error {
      margin: 14px 0 0;
      padding: 10px 12px;
      border-radius: 12px;
      background: color-mix(in srgb, var(--danger) 12%, transparent);
      color: var(--danger);
      font-size: 12px;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .error[hidden] { display: none; }
    #auth-fields .field-label { margin-top: 14px; }
    #auth-fields .field-label:first-child { margin-top: 0; }
    .remember { display: flex; align-items: center; gap: 8px; margin: 14px 0 0; color: var(--ink); font-size: 12.5px; font-weight: 600; cursor: pointer; }
    .remember input { width: 16px; height: 16px; margin: 0; accent-color: var(--primary); }
    .footer { display: flex; justify-content: space-between; gap: 12px; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 10.5px; }
    .footnote { margin: 0; color: var(--muted); font-size: 11px; }
    @media (prefers-reduced-motion: reduce) {
      .btn { transition: none; }
      .btn:hover:not(:disabled) { transform: none; }
    }
  </style>
</head>
<body>
  <main class="launch">
    <header class="heading">
      <svg class="brand-mark" width="64" height="64" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <rect x="4" y="8" width="24" height="18" rx="4"/>
        <path d="m11 4 5 4 5-4"/>
        <path d="M10 29l2-3m10 3-2-3"/>
        <circle cx="11.5" cy="16.5" r="1.25" fill="currentColor" stroke="none"/>
        <path d="M19 17c1.5-1.8 3.2-1.8 4.7 0"/>
      </svg>
      <h1 class="title">Piik-RTC<span class="dot">.</span><small>屏幕共享</small></h1>
      <p class="welcome"><span class="spark">✦</span>不同的屏幕，同一个小客厅。</p>
    </header>

    <section class="panel">
      <div class="panel-heading">
        <h2 id="heading">连接你的小客厅</h2>
        <p id="description">需要连接一个已部署的 Piik-RTC 服务。</p>
      </div>
      <form id="form">
        <div id="server-field">
          <label class="field-label" for="server">服务器地址</label>
          <label class="input">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
            <input id="server" name="server" type="url" placeholder="https://piik.example.com" autocomplete="url" spellcheck="false" required/>
          </label>
          <p class="hint">邀请链接和房间数据来自同一台服务器。</p>
          <p class="hint">在窗口内右键打开菜单。</p>
        </div>
        <div id="auth-fields" hidden>
          <label class="field-label" for="username">用户名</label>
          <label class="input">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/></svg>
            <input id="username" name="username" autocomplete="username" spellcheck="false"/>
          </label>
          <label class="field-label" for="password">密码</label>
          <label class="input">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
            <input id="password" name="password" type="password" autocomplete="current-password"/>
          </label>
          <label class="remember"><input id="remember" type="checkbox"/>记住密码</label>
          <p class="hint">密码使用当前 Windows 账户加密后保存在本机。</p>
        </div>
        <div class="actions">
          <button class="btn primary" id="connect" type="submit">
            <span>连接</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 12h16m-6.5-6.5L20 12l-6.5 6.5"/></svg>
          </button>
          <button class="btn secondary" id="back" type="button" hidden>返回应用</button>
        </div>
        <p class="error" id="error" hidden></p>
      </form>
      <footer class="footer"><span id="version"></span><span>Piik-RTC 桌面端</span></footer>
    </section>

    <p class="footnote">本地采集 · 媒体不经过 Piik 服务器中转 · 支持声网 / 即构 / 火山</p>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const bridge = window.piikDesktop;
    const input = document.getElementById('server');
    const form = document.getElementById('form');
    const connect = document.getElementById('connect');
    const back = document.getElementById('back');
    const errorBox = document.getElementById('error');
    const version = document.getElementById('version');
    const heading = document.getElementById('heading');
    const description = document.getElementById('description');
    const serverField = document.getElementById('server-field');
    const authFields = document.getElementById('auth-fields');
    const username = document.getElementById('username');
    const password = document.getElementById('password');
    const remember = document.getElementById('remember');
    const authMode = params.get('mode') === 'auth';

    const saved = params.get('url') || '';
    input.value = saved || 'http://localhost:3000';
    version.textContent = params.get('version') ? `v${params.get('version')}` : '';
    back.hidden = !saved;

    if (authMode) {
      heading.textContent = '登录服务器';
      description.textContent = (params.get('host') || '服务器') + ' 要求进行身份验证';
      serverField.hidden = true;
      authFields.hidden = false;
      input.disabled = true;
      connect.querySelector('span').textContent = '登录';
      back.textContent = '取消';
      back.hidden = false;
      username.value = params.get('user') || '';
      remember.checked = params.get('remember') !== '0';
      if (username.value) password.focus(); else username.focus();
    }

    const queryError = params.get('error');
    if (queryError) showError(queryError);

    function showError(message) {
      errorBox.hidden = !message;
      errorBox.textContent = message || '';
    }

    if (!bridge) {
      showError('请通过 Piik 桌面端打开此页面。');
      connect.disabled = true;
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();
      showError('');
      connect.disabled = true;
      connect.querySelector('span').textContent = authMode ? '正在登录…' : '正在连接…';
      try {
        if (authMode) {
          if (!password.value) { showError('请输入密码。'); return; }
          await bridge.submitAuth({ username: username.value.trim(), password: password.value, remember: remember.checked });
        } else {
          const result = await bridge.setServer(input.value.trim());
          if (!result || !result.ok) showError(result?.message || '无法连接这个服务器。');
        }
      } catch (error) {
        showError(error?.message || String(error));
      } finally {
        connect.disabled = false;
        connect.querySelector('span').textContent = authMode ? '登录' : '连接';
      }
    });

    back.addEventListener('click', async () => {
      if (!bridge) return;
      back.disabled = true;
      try {
        if (authMode) await bridge.cancelAuth();
        else await bridge.cancelSetup();
      } catch { /* keep the page visible */ }
      back.disabled = false;
    });
  </script>
</body>
</html>
