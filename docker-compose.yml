services:
  piik-sw:
    build:
      context: .
      args:
        VITE_AGORA_BADGE_URL: "${VITE_AGORA_BADGE_URL:-}"
    image: piik-sw:latest
    container_name: piik-sw
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 容器内端口固定，宿主机端口用 SCREEN_PORT 调整
      PORT: 3000
    ports:
      - "${SCREEN_PORT:-3000}:3000"
    volumes:
      - piik-sw-data:/app/data

volumes:
  piik-sw-data:
    name: piik-sw-data
