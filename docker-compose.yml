services:
  piik-rtc:
    image: ghcr.io/nth2miss/piik-rtc:latest
    pull_policy: always
    container_name: piik-rtc
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 容器内端口固定，宿主机端口用 SCREEN_PORT 调整
      PORT: 3000
    ports:
      - "${SCREEN_PORT:-3000}:3000"
    volumes:
      - piik-rtc-data:/app/data

volumes:
  piik-rtc-data:
    name: piik-rtc-data
