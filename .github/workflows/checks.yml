name: Checks

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test --test-timeout=30000 server/tests/*.test.js
      - run: npm run build
