name: Desktop

on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Install dependencies
        run: npm ci

      - name: Read package version
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = "v${{ steps.version.outputs.version }}" || {
            echo "Tag $GITHUB_REF_NAME does not match package.json v${{ steps.version.outputs.version }}"
            exit 1
          }

      - name: Build desktop
        env:
          PIIK_DEFAULT_SERVER_URL: ${{ vars.PIIK_DEFAULT_SERVER_URL }}
        run: npm run desktop:build

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v7
        with:
          name: Piik-RTC-desktop
          path: release/Piik.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Piik-RTC v${{ steps.version.outputs.version }}
          files: release/Piik.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
