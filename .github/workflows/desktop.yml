name: Desktop

on:
  workflow_dispatch:
    inputs:
      version:
        description: 发布版本（与 package.json 一致，如 1.1.6 或 v1.1.6）
        required: true
        type: string

run-name: Piik-RTC-${{ startsWith(inputs.version, 'v') && inputs.version || format('v{0}', inputs.version) }}

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validate release version
        id: version
        env:
          PIIK_RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/desktop-version.mjs
  checks:
    needs: version
    uses: ./.github/workflows/checks.yml
  build:
    needs: [version, checks]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Install dependencies
        run: npm ci

      - name: Test update integrity
        run: dotnet run --project desktop/tests/UpdateIntegrity.Tests.csproj --configuration Release

      - name: Build desktop
        env:
          PIIK_DEFAULT_SERVER_URL: ${{ vars.PIIK_DEFAULT_SERVER_URL }}
        run: npm run desktop:build -- --native-rtc

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v7
        with:
          name: Piik-RTC-desktop-v${{ needs.version.outputs.version }}
          path: |
            release/Piik-RTC-v${{ needs.version.outputs.version }}.exe
            release/native-volc-v${{ needs.version.outputs.version }}.zip
            release/version.json
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Piik-RTC v${{ needs.version.outputs.version }}
          files: |
            release/Piik-RTC-v${{ needs.version.outputs.version }}.exe
            release/native-volc-v${{ needs.version.outputs.version }}.zip
            release/version.json
          generate_release_notes: true
          fail_on_unmatched_files: true
